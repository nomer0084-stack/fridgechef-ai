name: Build FridgeChef AI Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Complete Android App
      run: |
        mkdir -p app/src/main/java/com/fridgechef/ai/data
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable

        # 1. settings.gradle.kts
        cat << 'SUBEOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "FridgeChefAI"
        include(":app")
        SUBEOF

        # 2. build.gradle.kts (Root)
        cat << 'SUBEOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
        }
        SUBEOF

        # 3. gradle.properties
        cat << 'SUBEOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        SUBEOF

        # 4. app/build.gradle.kts
        cat << 'SUBEOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.fridgechef.ai"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.fridgechef.ai"
                minSdk = 24
                targetSdk = 34
                versionCode = 4
                versionName = "1.3.0"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    signingConfig = signingConfigs.getByName("debug")
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            kotlinOptions {
                jvmTarget = "1.8"
            }
            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.14"
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.0")
            implementation("androidx.activity:activity-compose:1.9.0")
            implementation(platform("androidx.compose:compose-bom:2024.05.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("com.squareup.okhttp3:okhttp:4.12.0")
            implementation("com.google.code.gson:gson:2.10.1")
        }
        SUBEOF

        # 5. AndroidManifest.xml
        cat << 'SUBEOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-feature android:name="android.hardware.camera" android:required="false" />

            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_launcher"
                android:label="FridgeChef AI"
                android:roundIcon="@drawable/ic_launcher"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        SUBEOF

        # 6. Drawable Icon
        cat << 'SUBEOF' > app/src/main/res/drawable/ic_launcher.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#2E7D32"
                android:pathData="M10,10 h88 v88 H10 z"/>
            <path
                android:fillColor="#FBC02D"
                android:pathData="M34,22 C34,16 42,14 46,18 C50,14 58,14 62,18 C66,14 74,16 74,22 C74,26 70,28 66,28 L42,28 C38,28 34,26 34,22 Z"/>
            <path
                android:fillColor="#FFFFFF"
                android:pathData="M32,32 h44 c3.3,0 6,2.7 6,6 v46 c0,3.3 -2.7,6 -6,6 H32 c-3.3,0 -6,-2.7 -6,-6 V38 c0,-3.3 2.7,-6 6,-6 z"/>
            <path
                android:fillColor="#FBC02D"
                android:pathData="M38,40 h14 v44 H38 z M56,40 h14 v44 H56 z"/>
        </vector>
        SUBEOF

        # 7. Models.kt
        cat << 'SUBEOF' > app/src/main/java/com/fridgechef/ai/data/Models.kt
        package com.fridgechef.ai.data

        data class Recipe(
            val title: String = "",
            val timeMinutes: Int = 20,
            val difficulty: String = "Легко",
            val calories: Int = 320,
            val ingredientsUsed: List<String> = emptyList(),
            val missingOptional: List<String> = emptyList(),
            val steps: List<String> = emptyList()
        )

        data class RecipeGenerationResult(
            val detectedProducts: List<String> = emptyList(),
            val recipes: List<Recipe> = emptyList()
        )

        data class UserProfile(
            val name: String = "Шеф-Повар",
            val email: String = "user@fridgechef.ai",
            val dietType: String = "Любая еда",
            val cookingSkill: String = "Любитель",
            val isPro: Boolean = false
        )

        data class ExpiryItem(
            val id: String = java.util.UUID.randomUUID().toString(),
            val name: String,
            val daysLeft: Int
        )
        SUBEOF

        # 8. AiRecipeService.kt (Advanced Vision Detection & Russian Recipes)
        cat << 'SUBEOF' > app/src/main/java/com/fridgechef/ai/data/AiRecipeService.kt
        package com.fridgechef.ai.data

        import android.graphics.Bitmap
        import android.util.Base64
        import com.google.gson.Gson
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.withContext
        import okhttp3.MediaType.Companion.toMediaType
        import okhttp3.OkHttpClient
        import okhttp3.Request
        import okhttp3.RequestBody.Companion.toRequestBody
        import org.json.JSONArray
        import org.json.JSONObject
        import java.io.ByteArrayOutputStream
        import java.util.concurrent.TimeUnit

        class AiRecipeService(private val apiKey: String) {
            private val client = OkHttpClient.Builder()
                .connectTimeout(35, TimeUnit.SECONDS)
                .readTimeout(35, TimeUnit.SECONDS)
                .build()
            private val gson = Gson()

            // Detect ingredients directly from photo
            suspend fun detectIngredientsFromPhoto(photo: Bitmap): List<String> =
                withContext(Dispatchers.IO) {
                    try {
                        if (apiKey.isBlank() || apiKey.startsWith("AIzaSy_FridgeChef_Demo")) {
                            return@withContext listOf("Помидоры", "Сыр", "Яйца", "Сливочное масло", "Зелень")
                        }

                        val url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey"
                        val prompt = "Ты профессиональный повар. Внимательно посмотри на фото холодильника и перечисли все съедобные продукты, которые ты видишь, на русском языке через запятую (например: Сыр, Яйца, Помидоры, Молоко). Больше ничего не пиши."

                        val parts = JSONArray().apply {
                            put(JSONObject().put("text", prompt))
                            val stream = ByteArrayOutputStream()
                            photo.compress(Bitmap.CompressFormat.JPEG, 75, stream)
                            val b64 = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)
                            put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", b64)))
                        }

                        val contents = JSONArray().put(JSONObject().put("parts", parts))
                        val reqBody = JSONObject().put("contents", contents).toString().toRequestBody("application/json".toMediaType())
                        val request = Request.Builder().url(url).post(reqBody).build()
                        val response = client.newCall(request).execute()
                        val resStr = response.body?.string().orEmpty()

                        if (!response.isSuccessful) {
                            return@withContext listOf("Помидоры", "Сыр", "Яйца", "Сливочное масло", "Зелень")
                        }

                        val root = JSONObject(resStr)
                        val text = root.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                        val list = text.split(",", "\n", ";").map { it.trim().trim('.', '-').replaceFirstChar { c -> if (c.isLowerCase()) c.titlecase() else c.toString() } }.filter { it.length > 1 }
                        if (list.isNotEmpty()) list else listOf("Помидоры", "Сыр", "Яйца", "Сливочное масло", "Зелень")
                    } catch (e: Exception) {
                        listOf("Помидоры", "Сыр", "Яйца", "Сливочное масло", "Зелень")
                    }
                }

            suspend fun fetchRecipes(ingredients: List<String>, photo: Bitmap?, userProfile: UserProfile): Result<RecipeGenerationResult> =
                withContext(Dispatchers.IO) {
                    try {
                        if (apiKey.isBlank() || apiKey.startsWith("AIzaSy_FridgeChef_Demo")) {
                            return@withContext Result.success(getSmartLocalRecipes(ingredients, photo != null))
                        }

                        val url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey"
                        val photoInstruction = if (photo != null) {
                            "Проанализируй фото продуктов. Определи продукты на фото и верни их в поле detectedProducts. Добавь их к выбранным: " + ingredients.joinToString(", ") + ". "
                        } else {
                            "Используй продукты: " + ingredients.joinToString(", ") + ". "
                        }

                        val prompt = photoInstruction + "Диета: " + userProfile.dietType + ", уровень готовки: " + userProfile.cookingSkill + ". " +
                            "Составь 3 рецепта блюд строго на русском языке. Ответ верни в виде JSON объекта (без markdown кавычек) со свойствами: " +
                            "detectedProducts (массив строк), recipes (массив объектов с полями: title, timeMinutes, difficulty, calories, ingredientsUsed, missingOptional, steps)."

                        val parts = JSONArray().apply {
                            put(JSONObject().put("text", prompt))
                            photo?.let {
                                val stream = ByteArrayOutputStream()
                                it.compress(Bitmap.CompressFormat.JPEG, 70, stream)
                                val b64 = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)
                                put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", b64)))
                            }
                        }

                        val contents = JSONArray().put(JSONObject().put("parts", parts))
                        val reqBody = JSONObject().put("contents", contents).toString().toRequestBody("application/json".toMediaType())
                        val request = Request.Builder().url(url).post(reqBody).build()
                        val response = client.newCall(request).execute()
                        val resStr = response.body?.string().orEmpty()

                        if (!response.isSuccessful) {
                            return@withContext Result.success(getSmartLocalRecipes(ingredients, photo != null))
                        }

                        val root = JSONObject(resStr)
                        val text = root.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                        val clean = text.replace("```json", "").replace("```", "").trim()
                        val parsedObj = gson.fromJson(clean, RecipeGenerationResult::class.java)
                        Result.success(parsedObj)
                    } catch (e: Exception) {
                        Result.success(getSmartLocalRecipes(ingredients, photo != null))
                    }
                }

            private fun getSmartLocalRecipes(ing: List<String>, hasPhoto: Boolean): RecipeGenerationResult {
                val detected = if (hasPhoto) listOf("Помидоры", "Сыр", "Сливочное масло", "Зелень") else emptyList()
                val combined = (ing + detected).distinct()
                val list = if (combined.isEmpty()) listOf("Яйца", "Сыр", "Помидоры") else combined

                val recipes = listOf(
                    Recipe(
                        title = if (hasPhoto) "Запеканка из продуктов с фото" else "Сытный омлет 'Fridge Master'",
                        timeMinutes = 15,
                        difficulty = "Легко",
                        calories = 320,
                        ingredientsUsed = list.take(4),
                        missingOptional = listOf("Черный перец", "Свежая зелень"),
                        steps = listOf(
                            "Разогрейте сковороду или форму для запекания.",
                            "Нарежьте имеющиеся продукты (" + list.take(2).joinToString(", ") + ") и подрумяньте 3 минуты.",
                            "Залейте основой (яйца или сыр) и томите под крышкой 7 минут до золотистой корочки."
                        )
                    ),
                    Recipe(
                        title = "Экспресс-салат Шефа",
                        timeMinutes = 10,
                        difficulty = "Быстро",
                        calories = 210,
                        ingredientsUsed = list.take(3),
                        missingOptional = listOf("Оливковое масло", "Соль"),
                        steps = listOf(
                            "Крупно нарежьте овощи и сыр.",
                            "Слегка сбрызните маслом и посыпьте специями.",
                            "Подавайте свежим в качестве легкого перекуса."
                        )
                    ),
                    Recipe(
                        title = "Горячее рагу из холодильника",
                        timeMinutes = 20,
                        difficulty = "Средне",
                        calories = 370,
                        ingredientsUsed = list,
                        missingOptional = listOf("Чеснок", "Лавровый лист"),
                        steps = listOf(
                            "Нарежьте все ингредиенты средними кубиками.",
                            "Обжарьте на среднем огне 5 минут.",
                            "Добавьте немного воды и тушите до готовности 12 минут."
                        )
                    )
                )

                return RecipeGenerationResult(detectedProducts = detected, recipes = recipes)
            }
        }
        SUBEOF

        # 9. MainActivity.kt (Photo Detection Panel, Clean Russian TTS, Secret Key PRO)
        cat << 'SUBEOF' > app/src/main/java/com/fridgechef/ai/MainActivity.kt
        package com.fridgechef.ai

        import android.Manifest
        import android.app.Activity
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.graphics.Bitmap
        import android.graphics.ImageDecoder
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.MediaStore
        import android.speech.RecognizerIntent
        import android.speech.tts.TextToSpeech
        import java.util.Locale
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.lazy.items
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.core.content.ContextCompat
        import com.fridgechef.ai.data.AiRecipeService
        import com.fridgechef.ai.data.ExpiryItem
        import com.fridgechef.ai.data.Recipe
        import com.fridgechef.ai.data.UserProfile
        import kotlinx.coroutines.launch

        val BrandGreen = Color(0xFF2E7D32)
        val BrandGreenDark = Color(0xFF1B5E20)
        val BrandGreenLight = Color(0xFFE8F5E9)
        val BrandYellow = Color(0xFFFBC02D)
        val BrandYellowLight = Color(0xFFFFF9C4)
        val AppBg = Color(0xFFF8FAF7)

        const val FREE_LIMIT = 3
        const val SECRET_PRO_KEY = "FRIDGE-CHEF-PRO-2026"

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme(
                        colorScheme = lightColorScheme(
                            primary = BrandGreen,
                            secondary = BrandYellow,
                            background = AppBg
                        )
                    ) {
                        Surface(modifier = Modifier.fillMaxSize(), color = AppBg) {
                            FridgeChefRoot()
                        }
                    }
                }
            }
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun FridgeChefRoot() {
            val context = LocalContext.current
            val prefs = remember { context.getSharedPreferences("fridgechef_prefs", Context.MODE_PRIVATE) }
            val scope = rememberCoroutineScope()

            var isRegistered by remember { mutableStateOf(prefs.getBoolean("is_registered", false)) }
            var freeGenerationsUsed by remember { mutableStateOf(prefs.getInt("free_generations_used", 0)) }

            var userProfile by remember {
                mutableStateOf(
                    UserProfile(
                        name = prefs.getString("user_name", "Шеф-Повар") ?: "Шеф-Повар",
                        email = prefs.getString("user_email", "user@fridgechef.ai") ?: "user@fridgechef.ai",
                        dietType = prefs.getString("user_diet", "Любая еда") ?: "Любая еда",
                        cookingSkill = prefs.getString("user_skill", "Любитель") ?: "Любитель",
                        isPro = prefs.getBoolean("is_pro", false)
                    )
                )
            }

            var selectedTab by remember { mutableStateOf(0) }
            var showProDialog by remember { mutableStateOf(false) }
            var showLimitDialog by remember { mutableStateOf(false) }

            val defaultKey = "AIzaSy_FridgeChef_DemoAutoKey"
            var apiKey by remember { mutableStateOf(prefs.getString("api_key", defaultKey) ?: defaultKey) }

            val popularIngredients = listOf("Яйца", "Сыр", "Помидоры", "Молоко", "Курица", "Гречка", "Рис", "Творог", "Картофель", "Лук", "Макароны", "Морковь")
            val selectedIngredients = remember { mutableStateListOf("Яйца", "Сыр", "Помидоры") }
            var customIngredient by remember { mutableStateOf("") }
            var cameraPhoto by remember { mutableStateOf<Bitmap?>(null) }
            val photoDetectedIngredients = remember { mutableStateListOf<String>() }

            val recipes = remember { mutableStateListOf<Recipe>() }
            var isLoading by remember { mutableStateOf(false) }
            var isScanningPhoto by remember { mutableStateOf(false) }

            val expiryItems = remember {
                mutableStateListOf(
                    ExpiryItem(name = "Молоко 3.2%", daysLeft = 2),
                    ExpiryItem(name = "Свежая зелень (укроп)", daysLeft = 1),
                    ExpiryItem(name = "Творог 5%", daysLeft = 3),
                    ExpiryItem(name = "Сыр Чеддер", daysLeft = 7)
                )
            }

            fun onPhotoReady(bitmap: Bitmap) {
                cameraPhoto = bitmap
                isScanningPhoto = true
                scope.launch {
                    val service = AiRecipeService(apiKey)
                    val detected = service.detectIngredientsFromPhoto(bitmap)
                    photoDetectedIngredients.clear()
                    photoDetectedIngredients.addAll(detected)
                    isScanningPhoto = false
                    Toast.makeText(context, "Найдено продуктов: ${detected.size}!", Toast.LENGTH_SHORT).show()
                }
            }

            val cameraLauncher = rememberLauncherForActivityResult(ActivityResultContracts.TakePicturePreview()) { bitmap ->
                if (bitmap != null) {
                    onPhotoReady(bitmap)
                }
            }

            val cameraPermissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { isGranted ->
                if (isGranted) {
                    cameraLauncher.launch(null)
                } else {
                    Toast.makeText(context, "Разрешите доступ к камере в настройках Android", Toast.LENGTH_LONG).show()
                }
            }

            val galleryLauncher = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                uri?.let {
                    try {
                        val bmp = if (Build.VERSION.SDK_INT < 28) {
                            @Suppress("DEPRECATION")
                            MediaStore.Images.Media.getBitmap(context.contentResolver, it)
                        } else {
                            val source = ImageDecoder.createSource(context.contentResolver, it)
                            ImageDecoder.decodeBitmap(source)
                        }
                        onPhotoReady(bmp)
                    } catch (e: Exception) {
                        Toast.makeText(context, "Не удалось открыть фото", Toast.LENGTH_SHORT).show()
                    }
                }
            }

            val speechLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                if (result.resultCode == Activity.RESULT_OK) {
                    val spokenText = result.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()
                    if (!spokenText.isNullOrBlank()) {
                        val parts = spokenText.split(",", " и ", " а также ").map { it.trim() }.filter { it.isNotBlank() }
                        parts.forEach { phrase ->
                            val clean = phrase.replaceFirstChar { if (it.isLowerCase()) it.titlecase() else it.toString() }
                            if (!selectedIngredients.contains(clean)) {
                                selectedIngredients.add(clean)
                            }
                        }
                        Toast.makeText(context, "Добавлено: " + parts.joinToString(", "), Toast.LENGTH_SHORT).show()
                    }
                }
            }

            if (!isRegistered) {
                RegistrationView(onRegisterSuccess = { name, email ->
                    prefs.edit()
                        .putBoolean("is_registered", true)
                        .putString("user_name", name)
                        .putString("user_email", email)
                        .apply()
                    userProfile = userProfile.copy(name = name, email = email)
                    isRegistered = true
                })
            } else {
                Scaffold(
                    topBar = {
                        TopAppBar(
                            title = {
                                Row(verticalAlignment = Alignment.CenterVertically) {
                                    Box(
                                        modifier = Modifier.size(36.dp).clip(CircleShape).background(BrandYellow),
                                        contentAlignment = Alignment.Center
                                    ) {
                                        Text("👨‍🍳", fontSize = 20.sp)
                                    }
                                    Spacer(modifier = Modifier.width(10.dp))
                                    Column {
                                        Row(verticalAlignment = Alignment.CenterVertically) {
                                            Text("FridgeChef AI", fontWeight = FontWeight.Bold, fontSize = 18.sp, color = Color.White)
                                            if (userProfile.isPro) {
                                                Spacer(modifier = Modifier.width(6.dp))
                                                Surface(color = BrandYellow, shape = RoundedCornerShape(6.dp)) {
                                                    Text("PRO", color = Color.Black, fontSize = 10.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 5.dp, vertical = 2.dp))
                                                }
                                            }
                                        }
                                        val subTitle = if (userProfile.isPro) "Безлимитный PRO" else "Осталось: " + (FREE_LIMIT - freeGenerationsUsed).coerceAtLeast(0) + " из $FREE_LIMIT"
                                        Text(subTitle, fontSize = 11.sp, color = BrandYellowLight)
                                    }
                                }
                            },
                            colors = TopAppBarDefaults.topAppBarColors(containerColor = BrandGreen),
                            actions = {
                                if (!userProfile.isPro) {
                                    TextButton(
                                        onClick = { showProDialog = true },
                                        colors = ButtonDefaults.textButtonColors(contentColor = Color.Black),
                                        modifier = Modifier.background(BrandYellow, RoundedCornerShape(16.dp)).height(32.dp)
                                    ) {
                                        Text("⭐ PRO", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                    }
                                }
                            }
                        )
                    },
                    bottomBar = {
                        NavigationBar(containerColor = Color.White) {
                            NavigationBarItem(
                                selected = selectedTab == 0,
                                onClick = { selectedTab = 0 },
                                icon = { Text("🛒", fontSize = 18.sp) },
                                label = { Text("Продукты") }
                            )
                            NavigationBarItem(
                                selected = selectedTab == 1,
                                onClick = { selectedTab = 1 },
                                icon = { Text("📖", fontSize = 18.sp) },
                                label = { Text("Рецепты") }
                            )
                            NavigationBarItem(
                                selected = selectedTab == 2,
                                onClick = { selectedTab = 2 },
                                icon = { Text("⏰", fontSize = 18.sp) },
                                label = { Text("Сроки") }
                            )
                            NavigationBarItem(
                                selected = selectedTab == 3,
                                onClick = { selectedTab = 3 },
                                icon = { Text("👤", fontSize = 18.sp) },
                                label = { Text("Профиль") }
                            )
                        }
                    }
                ) { padding ->
                    Box(modifier = Modifier.padding(padding).fillMaxSize()) {
                        when (selectedTab) {
                            0 -> IngredientsView(
                                popularList = popularIngredients,
                                selectedList = selectedIngredients,
                                customIngredient = customIngredient,
                                onCustomIngredientChange = { customIngredient = it },
                                onAddCustom = {
                                    if (customIngredient.isNotBlank()) {
                                        val item = customIngredient.trim()
                                        if (!selectedIngredients.contains(item)) selectedIngredients.add(item)
                                        customIngredient = ""
                                    }
                                },
                                onToggle = { item ->
                                    if (selectedIngredients.contains(item)) selectedIngredients.remove(item)
                                    else selectedIngredients.add(item)
                                },
                                hasPhoto = cameraPhoto != null,
                                isScanningPhoto = isScanningPhoto,
                                detectedPhotoList = photoDetectedIngredients,
                                onAddAllPhotoDetected = {
                                    photoDetectedIngredients.forEach { item ->
                                        if (!selectedIngredients.contains(item)) selectedIngredients.add(item)
                                    }
                                    Toast.makeText(context, "Все продукты с фото добавлены в список!", Toast.LENGTH_SHORT).show()
                                },
                                onRemovePhotoDetected = { item ->
                                    photoDetectedIngredients.remove(item)
                                },
                                onTakePhoto = {
                                    val granted = ContextCompat.checkSelfPermission(context, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                                    if (granted) {
                                        cameraLauncher.launch(null)
                                    } else {
                                        cameraPermissionLauncher.launch(Manifest.permission.CAMERA)
                                    }
                                },
                                onPickGallery = { galleryLauncher.launch("image/*") },
                                onVoiceInput = {
                                    val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                        putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                        putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ru-RU")
                                        putExtra(RecognizerIntent.EXTRA_PROMPT, "Назовите продукты на русском языке...")
                                    }
                                    try {
                                        speechLauncher.launch(intent)
                                    } catch (e: Exception) {
                                        Toast.makeText(context, "Голосовой ввод не поддерживается системой", Toast.LENGTH_SHORT).show()
                                    }
                                },
                                onGenerate = {
                                    if (!userProfile.isPro && freeGenerationsUsed >= FREE_LIMIT) {
                                        showLimitDialog = true
                                    } else {
                                        isLoading = true
                                        selectedTab = 1
                                        scope.launch {
                                            val service = AiRecipeService(apiKey)
                                            val res = service.fetchRecipes(selectedIngredients, cameraPhoto, userProfile)
                                            isLoading = false
                                            res.onSuccess { resultData ->
                                                recipes.clear()
                                                recipes.addAll(resultData.recipes)
                                                if (!userProfile.isPro) {
                                                    freeGenerationsUsed += 1
                                                    prefs.edit().putInt("free_generations_used", freeGenerationsUsed).apply()
                                                }
                                            }
                                        }
                                    }
                                }
                            )
                            1 -> RecipesView(
                                recipes = recipes,
                                isLoading = isLoading
                            )
                            2 -> ExpiryView(
                                items = expiryItems,
                                onCookItem = { item ->
                                    if (!selectedIngredients.contains(item.name)) selectedIngredients.add(item.name)
                                    selectedTab = 0
                                    Toast.makeText(context, "${item.name} добавлен в рецепты!", Toast.LENGTH_SHORT).show()
                                }
                            )
                            3 -> ProfileView(
                                profile = userProfile,
                                onUpdateProfile = { updated ->
                                    userProfile = updated
                                    prefs.edit()
                                        .putString("user_name", updated.name)
                                        .putString("user_diet", updated.dietType)
                                        .putString("user_skill", updated.cookingSkill)
                                        .putBoolean("is_pro", updated.isPro)
                                        .apply()
                                    Toast.makeText(context, "Профиль сохранен!", Toast.LENGTH_SHORT).show()
                                },
                                onOpenPro = { showProDialog = true }
                            )
                        }
                    }
                }
            }

            if (showLimitDialog) {
                AlertDialog(
                    onDismissRequest = { showLimitDialog = false },
                    title = { Text("Лимит генераций исчерпан", fontWeight = FontWeight.Bold, color = BrandGreenDark) },
                    text = {
                        Column {
                            Text("Вы использовали все $FREE_LIMIT бесплатные генерации рецептов.")
                            Spacer(modifier = Modifier.height(6.dp))
                            Text("Оформите PRO-подписку или активируйте промокод для безлимита!", color = Color.Gray, fontSize = 13.sp)
                        }
                    },
                    confirmButton = {
                        Button(
                            onClick = {
                                showLimitDialog = false
                                showProDialog = true
                            },
                            colors = ButtonDefaults.buttonColors(containerColor = BrandYellow)
                        ) {
                            Text("⭐ Оформить PRO", color = Color.Black, fontWeight = FontWeight.Bold)
                        }
                    },
                    dismissButton = {
                        TextButton(onClick = { showLimitDialog = false }) { Text("Позже", color = Color.Gray) }
                    }
                )
            }

            if (showProDialog) {
                ProDialog(
                    onDismiss = { showProDialog = false },
                    onActivateByKey = { key ->
                        if (key.trim().equals(SECRET_PRO_KEY, ignoreCase = true)) {
                            userProfile = userProfile.copy(isPro = true)
                            prefs.edit().putBoolean("is_pro", true).apply()
                            showProDialog = false
                            Toast.makeText(context, "🎉 PRO успешно активирован по секретному ключу!", Toast.LENGTH_LONG).show()
                            true
                        } else {
                            Toast.makeText(context, "Неверный ключ активации", Toast.LENGTH_SHORT).show()
                            false
                        }
                    }
                )
            }
        }

