        @Composable
        fun IngredientsScreen(
            popularList: List<String>,
            selectedList: List<String>,
            customIngredient: String,
            onCustomIngredientChange: (String) -> Unit,
            onAddCustom: () -> Unit,
            hasPhoto: Boolean,
            onTakePhoto: () -> Unit,
            onVoiceInput: () -> Unit,
            onGenerate: () -> Unit
        ) {
            LazyColumn(
                modifier = Modifier.fillMaxSize().padding(16.dp),
                verticalArrangement = Arrangement.spacedBy(14.dp)
            ) {
                item {
                    Card(
                        colors = CardDefaults.cardColors(containerColor = BrandGreenLight),
                        shape = RoundedCornerShape(18.dp),
                        modifier = Modifier.fillMaxWidth()
                    ) {
                        Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                            Column(modifier = Modifier.weight(1f)) {
                                Text("Что в холодильнике?", fontSize = 19.sp, fontWeight = FontWeight.Bold, color = BrandGreenDark)
                                Text("Сфотографируйте полку, продиктуйте голосом или выберите ниже.", fontSize = 13.sp, color = BrandGreen)
                            }
                        }
                    }
                }

                // Camera & Voice Input Row
                item {
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                        Button(
                            onClick = onTakePhoto,
                            colors = ButtonDefaults.buttonColors(containerColor = if (hasPhoto) BrandGreenDark else BrandGreen),
                            shape = RoundedCornerShape(14.dp),
                            modifier = Modifier.weight(1f).height(50.dp)
                        ) {
                            Icon(Icons.Default.CameraAlt, contentDescription = null, tint = BrandYellow)
                            Spacer(modifier = Modifier.width(6.dp))
                            Text(if (hasPhoto) "Камера ✓" else "Камера", fontSize = 14.sp, fontWeight = FontWeight.Bold)
                        }

                        Button(
                            onClick = onVoiceInput,
                            colors = ButtonDefaults.buttonColors(containerColor = BrandYellow),
                            shape = RoundedCornerShape(14.dp),
                            modifier = Modifier.weight(1f).height(50.dp)
                        ) {
                            Icon(Icons.Default.Mic, contentDescription = null, tint = BrandGreenDark)
                            Spacer(modifier = Modifier.width(6.dp))
                            Text("Голос 🎙️", fontSize = 14.sp, fontWeight = FontWeight.Bold, color = BrandGreenDark)
                        }
                    }
                }

                // Manual text input
                item {
                    Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                        OutlinedTextField(
                            value = customIngredient,
                            onValueChange = onCustomIngredientChange,
                            placeholder = { Text("Добавить продукт вручную...") },
                            singleLine = true,
                            modifier = Modifier.weight(1f),
                            shape = RoundedCornerShape(14.dp)
                        )
                        Spacer(modifier = Modifier.width(8.dp))
                        Button(
                            onClick = onAddCustom,
                            shape = RoundedCornerShape(14.dp),
                            colors = ButtonDefaults.buttonColors(containerColor = BrandGreen),
                            modifier = Modifier.height(54.dp)
                        ) {
                            Icon(Icons.Default.Add, contentDescription = "Добавить", tint = Color.White)
                        }
                    }
                }

                item {
                    Text("Быстрый выбор из холодильника:", fontWeight = FontWeight.Bold, fontSize = 15.sp, color = BrandGreenDark)
                    Spacer(modifier = Modifier.height(6.dp))
                    Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                        popularList.chunked(3).forEach { rowItems ->
                            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                rowItems.forEach { item ->
                                    val isSelected = selectedList.contains(item)
                                    FilterChip(
                                        selected = isSelected,
                                        onClick = { onToggle(item) },
                                        label = { Text(item, fontSize = 13.sp) },
                                        leadingIcon = if (isSelected) {
                                            { Icon(Icons.Default.Check, contentDescription = null, modifier = Modifier.size(14.dp), tint = BrandGreenDark) }
                                        } else null,
                                        colors = FilterChipDefaults.filterChipColors(
                                            selectedContainerColor = BrandYellow,
                                            selectedLabelColor = Color.Black
                                        ),
                                        modifier = Modifier.weight(1f)
                                    )
                                }
                            }
                        }
                    }
                }

                item {
                    Spacer(modifier = Modifier.height(8.dp))
                    Button(
                        onClick = onGenerate,
                        modifier = Modifier.fillMaxWidth().height(56.dp),
                        shape = RoundedCornerShape(16.dp),
                        colors = ButtonDefaults.buttonColors(containerColor = BrandGreen)
                    ) {
                        Icon(Icons.Default.AutoAwesome, contentDescription = null, tint = BrandYellow)
                        Spacer(modifier = Modifier.width(10.dp))
                        Text("Сгенерировать рецепты (${selectedList.size})", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = Color.White)
                    }
                }
            }
        }

        @Composable
        fun RecipesScreen(recipes: List<Recipe>, isLoading: Boolean, onGoBack: () -> Unit) {
            if (isLoading) {
                Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        CircularProgressIndicator(color = BrandGreen)
                        Spacer(modifier = Modifier.height(16.dp))
                        Text("Шеф-ИИ подбирает рецепты...", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = BrandGreenDark)
                        Text("Без лишних покупок, только из ваших продуктов", fontSize = 13.sp, color = Color.Gray)
                    }
                }
                return
            }

            if (recipes.isEmpty()) {
                Box(modifier = Modifier.fillMaxSize().padding(24.dp), contentAlignment = Alignment.Center) {
                    Column(horizontalAlignment = Alignment.CenterHorizontally) {
                        Icon(Icons.Default.SoupKitchen, contentDescription = null, tint = BrandYellow, modifier = Modifier.size(64.dp))
                        Spacer(modifier = Modifier.height(12.dp))
                        Text("Рецептов пока нет", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                        Text("Отметьте продукты на первой вкладке и нажмите кнопку генерации!", color = Color.Gray, fontSize = 14.sp)
                    }
                }
                return
            }

            LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                items(recipes) { recipe ->
                    Card(
                        shape = RoundedCornerShape(18.dp),
                        colors = CardDefaults.cardColors(containerColor = Color.White),
                        elevation = CardDefaults.cardElevation(2.dp),
                        modifier = Modifier.fillMaxWidth()
                    ) {
                        Column(modifier = Modifier.padding(16.dp)) {
                            Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                Text(recipe.title, fontSize = 18.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f), color = BrandGreenDark)
                                Surface(shape = RoundedCornerShape(8.dp), color = BrandYellowLight) {
                                    Text("⏱ ${recipe.timeMinutes} мин", modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp), fontSize = 12.sp, fontWeight = FontWeight.Bold, color = Color(0xFFE65100))
                                }
                            }
                            Spacer(modifier = Modifier.height(6.dp))
                            Text("🔥 ${recipe.calories} ккал   •   ⚡ ${recipe.difficulty}", fontSize = 13.sp, color = Color.Gray)
                            Spacer(modifier = Modifier.height(10.dp))
                            Text("Используется из холодильника:", fontWeight = FontWeight.Bold, fontSize = 13.sp, color = BrandGreen)
                            Text(recipe.ingredientsUsed.joinToString(", "), fontSize = 13.sp)

                            if (recipe.missingOptional.isNotEmpty()) {
                                Spacer(modifier = Modifier.height(4.dp))
                                Text("По желанию можно добавить: ${recipe.missingOptional.joinToString(", ")}", fontSize = 12.sp, color = Color.Gray)
                            }

                            Spacer(modifier = Modifier.height(10.dp))
                            Text("Пошаговый рецепт:", fontWeight = FontWeight.Bold, fontSize = 13.sp)
                            recipe.steps.forEachIndexed { i, step ->
                                Text("${i + 1}. $step", fontSize = 13.sp, modifier = Modifier.padding(vertical = 2.dp))
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun ExpiryScreen(items: List<ExpiryItem>, onCookItem: (ExpiryItem) -> Unit) {
            LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                item {
                    Card(colors = CardDefaults.cardColors(containerColor = BrandYellowLight), shape = RoundedCornerShape(16.dp), modifier = Modifier.fillMaxWidth()) {
                        Column(modifier = Modifier.padding(16.dp)) {
                            Text("Контроль сроков годности", fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Color(0xFFE65100))
                            Text("Используйте эти продукты первыми, чтобы ничего не выбрасывать!", fontSize = 13.sp, color = Color(0xFFBF360C))
                        }
                    }
                }
                items(items) { item ->
                    val color = when {
                        item.daysLeft <= 1 -> Color(0xFFD32F2F)
                        item.daysLeft <= 3 -> Color(0xFFF57C00)
                        else -> BrandGreen
                    }
                    Card(shape = RoundedCornerShape(14.dp), colors = CardDefaults.cardColors(containerColor = Color.White), elevation = CardDefaults.cardElevation(1.dp), modifier = Modifier.fillMaxWidth()) {
                        Row(modifier = Modifier.padding(16.dp).fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                            Column(modifier = Modifier.weight(1f)) {
                                Text(item.name, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                Text(if (item.daysLeft <= 1) "Истекает скоро!" else "Осталось дней: ${item.daysLeft}", color = color, fontSize = 13.sp, fontWeight = FontWeight.Medium)
                            }
                            Button(onClick = { onCookItem(item) }, colors = ButtonDefaults.buttonColors(containerColor = BrandGreen), shape = RoundedCornerShape(10.dp)) {
                                Text("В рецепты", fontSize = 13.sp, color = Color.White)
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun ProfileScreen(profile: UserProfile, onUpdateProfile: (UserProfile) -> Unit, onOpenPro: () -> Unit) {
            var name by remember { mutableStateOf(profile.name) }
            val diets = listOf("Любая еда", "Вегетарианство", "Без глютена", "Кето / Низкоуглеводное", "Фитнес (высокий белок)")
            var selectedDiet by remember { mutableStateOf(profile.dietType) }
            val skills = listOf("Новичок", "Любитель", "Шеф")
            var selectedSkill by remember { mutableStateOf(profile.cookingSkill) }

            LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                item {
                    // Profile Header Card
                    Card(colors = CardDefaults.cardColors(containerColor = Color.White), shape = RoundedCornerShape(18.dp), modifier = Modifier.fillMaxWidth()) {
                        Row(modifier = Modifier.padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                            Box(modifier = Modifier.size(60.dp).clip(CircleShape).background(BrandYellow), contentAlignment = Alignment.Center) {
                                Text("👨‍🍳", fontSize = 30.sp)
                            }
                            Spacer(modifier = Modifier.width(14.dp))
                            Column(modifier = Modifier.weight(1f)) {
                                Text(name, fontWeight = FontWeight.Bold, fontSize = 18.sp, color = BrandGreenDark)
                                Text(profile.email, fontSize = 12.sp, color = Color.Gray)
                                Spacer(modifier = Modifier.height(4.dp))
                                if (profile.isPro) {
                                    Surface(color = BrandYellow, shape = RoundedCornerShape(6.dp)) {
                                        Text("Активна PRO подписка", fontSize = 11.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 6.dp, vertical = 2.dp))
                                    }
                                } else {
                                    Text("Тариф: Базовый (3 рецепта/день)", fontSize = 11.sp, color = Color.Gray)
                                }
                            }
                        }
                    }
                }

                if (!profile.isPro) {
                    item {
                        Card(
                            colors = CardDefaults.cardColors(containerColor = BrandYellowLight),
                            shape = RoundedCornerShape(18.dp),
                            modifier = Modifier.fillMaxWidth().clickable { onOpenPro() }
                        ) {
                            Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                                Column(modifier = Modifier.weight(1f)) {
                                    Text("⭐ Перейдите на FridgeChef PRO", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = Color(0xFFE65100))
                                    Text("Безлимитные рецепты, меню на неделю и экспорт в доставку.", fontSize = 12.sp, color = Color.DarkGray)
                                }
                                Button(onClick = onOpenPro, colors = ButtonDefaults.buttonColors(containerColor = BrandYellow)) {
                                    Text("Подробнее", color = Color.Black, fontWeight = FontWeight.Bold, fontSize = 12.sp)
                                }
                            }
                        }
                    }
                }

                item {
                    Text("Предпочтения в питании:", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = BrandGreenDark)
                    Spacer(modifier = Modifier.height(8.dp))
                    Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {
                        diets.forEach { diet ->
                            Row(
                                modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(10.dp)).background(if (selectedDiet == diet) BrandGreenLight else Color.White).clickable { selectedDiet = diet }.padding(12.dp),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                RadioButton(selected = selectedDiet == diet, onClick = { selectedDiet = diet }, colors = RadioButtonDefaults.colors(selectedColor = BrandGreen))
                                Spacer(modifier = Modifier.width(8.dp))
                                Text(diet, fontSize = 14.sp, fontWeight = if (selectedDiet == diet) FontWeight.Bold else FontWeight.Normal)
                            }
                        }
                    }
                }

                item {
                    Text("Уровень кулинарных навыков:", fontWeight = FontWeight.Bold, fontSize = 16.sp, color = BrandGreenDark)
                    Spacer(modifier = Modifier.height(8.dp))
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        skills.forEach { skill ->
                            val isSel = selectedSkill == skill
                            FilterChip(
                                selected = isSel,
                                onClick = { selectedSkill = skill },
                                label = { Text(skill) },
                                colors = FilterChipDefaults.filterChipColors(selectedContainerColor = BrandYellow, selectedLabelColor = Color.Black),
                                modifier = Modifier.weight(1f)
                            )
                        }
                    }
                }

                item {
                    Button(
                        onClick = {
                            onUpdateProfile(profile.copy(name = name, dietType = selectedDiet, cookingSkill = selectedSkill))
                        },
                        colors = ButtonDefaults.buttonColors(containerColor = BrandGreen),
                        shape = RoundedCornerShape(14.dp),
                        modifier = Modifier.fillMaxWidth().height(50.dp)
                    ) {
                        Text("Сохранить настройки профиля", color = Color.White, fontWeight = FontWeight.Bold)
                    }
                }
            }
        }

